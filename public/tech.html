<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Technician Dashboard</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="icon" href="/favicon.ico">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    html, body { margin:0; padding:0; overflow:hidden; height:100%; width:100%; }
    #scrollWrap {
      position: relative; width: 100%; height: 100%;
      overflow-x: auto; overflow-y: hidden;
      -webkit-overflow-scrolling: touch; touch-action: pan-x;
      overscroll-behavior-x: contain; scrollbar-width: none; -ms-overflow-style: none;
    }
    #scrollWrap::-webkit-scrollbar { display: none; }
    #scrollSpacer { width:100vh; height:1px; opacity:0; pointer-events:none; }
    .rotate-90-ccw {
      position: absolute; top: 100%; left: 0;
      transform-origin: left top; transform: rotate(-90deg);
      width: 100vh; height: 100vw; pointer-events:auto;
    }
    body { font-family:system-ui,Segoe UI,Roboto,Arial; background:#1a1024; color:#f0e6ff; }
    header {
      padding:16px; background:#2c1952;
      display:flex; justify-content:space-between; align-items:center;
      flex-wrap:wrap; gap:10px;
    }
    h1 { margin:0; font-size:20px; }
    table { width:100%; border-collapse:collapse; }
    th, td { padding:12px; text-align:left; vertical-align:top; }
    tr:not(:first-child) { border-top:1px solid rgba(255,255,255,0.08); }
    .status { font-weight:600; padding:6px 12px; border-radius:8px; display:inline-block; }
    .status.notpicked { background:#6b1f1f; color:#ffecec; }
    .status.preparing { background:#6b4d1f; color:#fff8e0; }
    .status.readyforcollection { background:#1e4f2d; color:#ffffff; animation:readyGlow 2.8s ease-in-out infinite alternate; }
    @keyframes readyGlow { from { transform:scale(1); box-shadow:0 0 0 rgba(0,255,120,0); } to { transform:scale(1.03); box-shadow:0 0 20px rgba(0,255,120,0.4); } }
    .asset-pill { display:inline-block; border-radius:8px; padding:6px 10px; margin:3px 4px 0 0; font-weight:600; }
    .asset-video { background:rgba(128,0,128,0.25); color:#efe8ff; }
    .asset-sound { background:rgba(200,50,50,0.25); color:#ffecec; }
    .asset-lighting { background:rgba(255,235,59,0.45); color:#ffffff; }
    .asset-grip { background:rgba(0,123,255,0.28); color:#eaf2ff; }
    .asset-uncategorised { background:rgba(200,200,200,0.18); color:#f0f0f0; }
    .top-btn { padding:10px 22px; border-radius:30px; border:2px solid white; cursor:pointer; font-weight:700; background:white; color:black; font-size:16px; transition:.15s; }
    .top-btn.selected { background:#f1c232; border-color:#f1c232; color:black; box-shadow:0 0 10px rgba(255,200,50,0.6); }
    button { border-radius:20px !important; padding:6px 12px; border:0; cursor:pointer; font-weight:700; font-size:14px; }
    
    /* Dynamic Action Button Classes */
    .btn-action-step { min-width: 160px; text-align: center; }
    .btn-step-preparing { background:#f1c232; color:#222; }
    .btn-step-ready { background:#1e4f2d; color:#fff; animation: readyGlow 2s infinite; }
    .btn-step-clear { background:#777; color:#fff; }

    .readyin-wrap { display:inline-flex; align-items:center; gap:6px; margin-top:8px; }
    .readyin-chip { font-size:12px; background:rgba(255,255,255,0.08); padding:4px 8px; border-radius:25px; }
    .readyin-btn { padding:6px 12px; border-radius:25px; background:#333; color:#fff; font-weight:700; }
    
    #clock { font-size:20px; font-weight:600; opacity:.9; display: flex; align-items: center; }
    .count-badge { background: #f1c232; color: #000; padding: 2px 8px; border-radius: 12px; font-size: 14px; font-weight: 800; }
    .weekly-stats { font-size: 16px; font-weight: 700; background: rgba(255,255,255,0.1); padding: 8px 15px; border-radius: 20px; margin-right: 15px; color: #f1c232; }

    #annotateCanvas { position:fixed; top:0; left:0; width:100vw; height:100vh; background:transparent; z-index:999999; touch-action:none; }
    .noclick { pointer-events:none !important; }
    #annotateTools { position:fixed; top:10px; right:180px; z-index:1000000; pointer-events:none; }
    #annotateToolsInner { transform: rotate(-90deg); transform-origin: top right; display:flex; flex-direction:column; gap:8px; pointer-events:auto; }
    .tool-btn { background:rgba(255,255,255,0.35); border-radius:24px; padding:8px 16px; font-weight:700; border:1px solid rgba(255,255,255,0.4); font-size:14px; color:black; cursor:pointer; backdrop-filter: blur(4px); }

    #weekSelectorWrap, #utilYearWrap { display: none; align-items: center; gap: 10px; background: rgba(255,255,255,0.1); padding: 5px 15px; border-radius: 30px; }
    #weekPicker, #yearPicker { background: transparent; border: none; color: white; font-family: inherit; font-size: 16px; color-scheme: dark; cursor: pointer; outline: none; }
    .calendar-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; margin-top: 10px; }
    .calendar-day { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 12px; min-height: 400px; }
    .calendar-day.collected-day { border-color: #1e4f2d; background: rgba(30, 79, 45, 0.2); }
    .day-header { font-size: 16px; font-weight: 800; margin-bottom: 10px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 5px; display: flex; flex-direction: column; }
    .day-booking-item { font-size: 13px; padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
    .collected-stamp { color: #5cff89; font-weight: 900; font-size: 10px; text-transform: uppercase; background: rgba(92, 255, 137, 0.15); padding: 2px 6px; border-radius: 4px; letter-spacing: 0.5px; width: fit-content; margin-top: 4px; }
    
    #utilContainer { max-width: 900px; margin: 20px auto; padding: 20px; background: rgba(255,255,255,0.05); border-radius: 20px; height: 500px; }

    /* Teachers & Departments Embedded Styles */
    .teacher-dashboard-root { background:#ffffff; color:#1e293b; border-radius:12px; padding:16px; font-size:14px; }
    .teacher-dashboard-root .tabs { display:flex; border-bottom:2px solid rgba(0,0,0,0.1); }
    .teacher-dashboard-root .tab { padding:12px 20px; cursor:pointer; font-weight:700; color:#64748b; font-size:16px; }
    .teacher-dashboard-root .tab.active { color:#0f172a; border-bottom:3px solid #EA0029; }
    .teacher-dashboard-root .section { display:none; padding:16px; position:relative; }
    .teacher-dashboard-root .section.active { display:block; }
    #teacherSearch {
      position:absolute; top:0; right:40px; transform:translateY(-50%);
      padding:8px 14px; width:150px; font-size:13px; border-radius:20px;
      background:#EA0029; border:2px solid #ad001e; color:white; outline:none; transition:0.25s; box-shadow:0 0 10px rgba(0,0,0,0.08);
    }
    #teacherSearch:focus { width:200px; background:#ad001e; box-shadow:0 0 14px rgba(234,0,41,0.2); }
    #teacherSearch::placeholder { color:#f8fafc; opacity:0.9; font-size:13px; }
    .teacher-dashboard-root table { width:100%; border-collapse:collapse; margin-top:10px; font-size:14px; color:#1e293b; }
    .teacher-dashboard-root th, .teacher-dashboard-root td { padding:10px; text-align:left; vertical-align:top; }
    .teacher-dashboard-root tr:not(:first-child) { border-top:1px solid rgba(0,0,0,0.08); }
    .teacher-name { width:160px; font-size:15px; font-weight:600; white-space:nowrap; color:#0f172a; }
    .dept-block { margin-top:20px; border-bottom:1px solid rgba(0,0,0,0.08); padding-bottom:10px; }
    .dept-header { cursor:pointer; font-size:18px; font-weight:700; display:flex; align-items:center; gap:8px; user-select:none; margin-bottom:6px; color:#0f172a; }
    .chevron { font-size:18px; transition:0.2s; color:#64748b; }
    .dept-summary { font-size:13px; color:#64748b; margin-bottom:6px; }
    .dept-content { display:none; }
    .teacher-dashboard-root .asset-pill { display:inline-block; border-radius:6px; padding:4px 8px; margin:3px 4px 0 0; font-size:13px; font-weight:600; }
    .teacher-dashboard-root .asset-video { background:rgba(147,51,234,0.15); color:#581c87; }
    .teacher-dashboard-root .asset-sound { background:rgba(239,68,68,0.15); color:#991b1b; }
    .teacher-dashboard-root .asset-lighting { background:rgba(234,179,8,0.25); color:#854d0e; }
    .teacher-dashboard-root .asset-grip { background:rgba(59,130,246,0.15); color:#1e40af; }
    .teacher-dashboard-root .asset-uncategorised { background:rgba(100,116,139,0.15); color:#334155; }
    .show-all-btn { margin-top:4px; padding:4px 10px; border-radius:12px; background:#ad001e; color:#efe8ff; font-size:12px; border:none; cursor:pointer; font-weight:700; align-self:flex-end; margin-left:auto; }
    .cat-stack { display:flex; flex-direction:column; align-items:flex-start; width:100%; gap:4px; padding-left:2px; }
  </style>
</head>
<body>

<canvas id="annotateCanvas"></canvas>
<div id="annotateTools">
  <div id="annotateToolsInner">
    <button class="tool-btn" onclick="toggleAnnotate()" id="toggleDrawBtn">DRAW OFF</button>
    <button class="tool-btn" onclick="undoStroke()">Undo</button>
    <button class="tool-btn" onclick="clearCanvas()">Clear</button>
    <button class="tool-btn" onclick="enableEraser()">Eraser</button>
  </div>
</div>

<div id="scrollWrap">
  <div id="scrollSpacer" aria-hidden="true"></div>
  <div class="rotate-90-ccw" id="rotatedDashboard">
    <header>
      <div style="display:flex; align-items:center; gap:20px;">
        <h1>Technician Dashboard</h1>
        <div style="display:flex; gap:12px;">
          <button id="btnUtil" onclick="switchDay('utilisation')" class="top-btn">Utilisation</button>
          <button id="btnOverview" onclick="switchDay('overview')" class="top-btn">Overview</button>
          <button id="btnTeachers" onclick="switchDay('teachers')" class="top-btn">Teachers</button>
          <button id="btnToday" onclick="switchDay('today')" class="top-btn selected">Today</button>
          <button id="btnTomorrow" onclick="switchDay('tomorrow')" class="top-btn">Tomorrow</button>
        </div>
      </div>
      
      <div id="utilYearWrap">
        <span style="font-size:13px; font-weight:800;">ACADEMIC YEAR:</span>
        <select id="yearPicker" onchange="fetchUtilisation()"></select>
      </div>

      <div id="weekSelectorWrap">
        <span style="font-size:13px; font-weight:800;">WEEK COMMENCING:</span>
        <input type="date" id="weekPicker" onchange="fetchBookings()">
      </div>
      <div id="clock">Loading...</div>
    </header>

    <main style="padding:16px">
      <div class="legend" id="legendBar">
        <span class="asset-pill asset-video">Video</span>
        <span class="asset-pill asset-sound">Sound</span>
        <span class="asset-pill asset-lighting">Lighting</span>
        <span class="asset-pill asset-grip">Grip</span>
        <span class="asset-pill asset-uncategorised">Uncategorised</span>
      </div>
      <div id="tableWrap"></div>
    </main>
  </div>
</div>

<script>
/* --- Annotation Logic --- */
const canvas = document.getElementById("annotateCanvas");
const ctx = canvas.getContext("2d");
const toggleDrawBtn = document.getElementById("toggleDrawBtn");
function getScrollWrap(){ return document.getElementById("scrollWrap"); }
function getScrollSpacer(){ return document.getElementById("scrollSpacer"); }
function getRotatedDashboard(){ return document.getElementById("rotatedDashboard"); }
let drawing = false, erasing = false, drawingEnabled = false;
const undoStack = [];
function resizeCanvas(){ canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
resizeCanvas(); window.addEventListener("resize", resizeCanvas);
function saveState() { undoStack.push(canvas.toDataURL()); if (undoStack.length > 40) undoStack.shift(); }
function undoStroke() { if (!undoStack.length) return; const img = new Image(); img.src = undoStack.pop(); img.onload = () => { ctx.clearRect(0,0,canvas.width,canvas.height); ctx.drawImage(img,0,0); }; }
function enableEraser(){ erasing = true; ctx.globalCompositeOperation = "destination-out"; }
function clearCanvas(){ ctx.clearRect(0,0,canvas.width,canvas.height); undoStack.length = 0; }
function toggleAnnotate(){
  drawingEnabled = !drawingEnabled;
  if (drawingEnabled){
    canvas.classList.remove("noclick"); toggleDrawBtn.textContent = "DRAW ON"; toggleDrawBtn.style.background = "#5cff89";
    getScrollWrap().style.overflow = "hidden"; canvas.style.touchAction = "none";
  } else {
    canvas.classList.add("noclick"); toggleDrawBtn.textContent = "DRAW OFF"; toggleDrawBtn.style.background = "rgba(255,255,255,0.35)";
    const sw = getScrollWrap(); sw.style.overflowX = "auto"; sw.style.overflowY = "hidden"; canvas.style.touchAction = "auto";
  }
}
canvas.classList.add("noclick");
canvas.addEventListener("pointerdown", e => { if (!drawingEnabled) return; saveState(); drawing = true; ctx.beginPath(); ctx.moveTo(e.clientX, e.clientY); ctx.globalCompositeOperation = erasing ? "destination-out" : "source-over"; });
canvas.addEventListener("pointermove", e => { if (!drawingEnabled || !drawing) return; ctx.lineCap = "round"; ctx.lineJoin = "round"; ctx.lineWidth = erasing ? 24 : 5; ctx.strokeStyle = "white"; ctx.lineTo(e.clientX, e.clientY); ctx.stroke(); });
canvas.addEventListener("pointerup", ()=>{ drawing = false; erasing = false; });

/* --- Dashboard Logic --- */
let dayMode = "today";
const weekPicker = document.getElementById("weekPicker");
const tableWrap = document.getElementById("tableWrap");
window.lastStats = ""; 
let currentChart = null;

function initYearPicker() {
    const sel = document.getElementById('yearPicker');
    const now = new Date();
    const currentYear = now.getMonth() >= 8 ? now.getFullYear() : now.getFullYear() - 1;
    for (let y = currentYear; y >= 2019; y--) {
        const opt = document.createElement('option');
        opt.value = y;
        opt.textContent = `Sept ${y} - July ${y+1}`;
        sel.appendChild(opt);
    }
}

function getMonday(d) {
  d = new Date(d); 
  let day = d.getDay();
  let diff = d.getDate() - day + (day == 0 ? -6 : 1);
  return new Date(d.setDate(diff));
}
weekPicker.valueAsDate = getMonday(new Date());

function updateClock(statsHTML = ""){ 
  document.getElementById("clock").innerHTML = statsHTML + new Date().toLocaleString("en-GB", { timeZone:"Europe/London" }); 
}
setInterval(() => {
  updateClock(dayMode === 'overview' ? (window.lastStats || "") : "");
}, 1000);

function formatTime(dt) {
  const d = new Date(dt);
  return isNaN(d) ? dt : d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit', timeZone: 'Europe/London' });
}

function renderAssets(arr){
  if (!Array.isArray(arr) || !arr.length) return "";
  const counts = new Map();
  for (const asset of arr){
    const name = (asset?.name || "").trim(); if (!name) continue;
    const cat = (asset?.category || "uncategorised").toLowerCase();
    const category = ["video","sound","lighting","grip","uncategorised"].includes(cat) ? cat : "uncategorised";
    if (!counts.has(name)) counts.set(name, { count: 0, category });
    counts.get(name).count += 1;
  }
  return Array.from(counts.entries()).map(([name, info]) => `<span class="asset-pill asset-${info.category}">${info.count > 1 ? `${name} x${info.count}` : name}</span>`).join("");
}

function syncRotatedLayout(){
  requestAnimationFrame(() => {
    const rd = getRotatedDashboard(); const ss = getScrollSpacer();
    if (!rd || !ss) return;
    const rect = rd.getBoundingClientRect();
    const width = Math.max(rd.scrollHeight, rect.width, window.innerHeight);
    ss.style.width = `${Math.ceil(width + 50)}px`;
  });
}

function switchDay(mode){
  dayMode = mode;
  window.lastStats = ""; 
  document.getElementById("btnUtil").classList.toggle("selected", mode==="utilisation");
  document.getElementById("btnOverview").classList.toggle("selected", mode==="overview");
  document.getElementById("btnTeachers").classList.toggle("selected", mode==="teachers");
  document.getElementById("btnToday").classList.toggle("selected", mode==="today");
  document.getElementById("btnTomorrow").classList.toggle("selected", mode==="tomorrow");
  
  document.getElementById("weekSelectorWrap").style.display = (mode === "overview") ? "flex" : "none";
  document.getElementById("utilYearWrap").style.display = (mode === "utilisation") ? "flex" : "none";
  document.getElementById("legendBar").style.display = (mode === "overview" || mode === "utilisation" || mode === "teachers") ? "none" : "block";

  if (mode === "utilisation") {
    fetchUtilisation();
  } else if (mode === "teachers") {
    loadTeachersDashboard();
  } else {
    fetchBookings();
  }
}

async function fetchUtilisation() {
  const year = document.getElementById('yearPicker').value;
  tableWrap.innerHTML = '<div id="utilContainer"><canvas id="utilChart"></canvas></div>';
  try {
    const r = await fetch(`/api/utilisation?year=${year}`);
    const data = await r.json();
    if (!data.success) return;

    const ctxChart = document.getElementById('utilChart').getContext('2d');
    if (currentChart) currentChart.destroy();
    
    currentChart = new Chart(ctxChart, {
      type: 'bar',
      data: {
        labels: data.labels,
        datasets: [{
          label: 'Total Bookings',
          data: data.counts,
          backgroundColor: '#f1c232',
          borderRadius: 8,
          borderWidth: 0
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { display: false },
          title: { display: true, text: 'Academic Year Volume (All Bookings)', color: '#f0e6ff', font: { size: 18 } }
        },
        scales: {
            y: { beginAtZero: true, grid: { color: 'rgba(255,255,255,0.1)' }, ticks: { color: '#f0e6ff' } },
            x: { grid: { display: false }, ticks: { color: '#f0e6ff' } }
        }
      }
    });
    syncRotatedLayout();
  } catch (err) { console.error("Utilisation fetch failed", err); }
}

function renderOverview(list) {
  const days = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"];
  const startMonday = getMonday(new Date(weekPicker.value));
  window.lastStats = `<span class="weekly-stats">Week Total: ${list.length}</span>`;
  updateClock(window.lastStats);

  let html = `<div class="calendar-grid">`;
  days.forEach((dayName, idx) => {
    const columnDate = new Date(startMonday);
    columnDate.setDate(startMonday.getDate() + idx);
    const colStr = columnDate.toISOString().split('T')[0];
    const dateLabel = columnDate.toLocaleDateString('en-GB', { day: '2-digit', month: '2-digit' });

    const dayBookings = list.filter(b => {
        const bDate = new Date(b.startdatetime);
        return bDate.toISOString().split('T')[0] === colStr;
    });

    const isAllCollected = dayBookings.length > 0 && dayBookings.every(b => 
      b.statuses && b.statuses.every(st => st.toLowerCase().includes("collected"))
    );

    html += `
      <div class="calendar-day ${isAllCollected ? 'collected-day' : ''}">
        <div class="day-header">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:4px;">
              <span style="font-size:12px; opacity:0.6;">${dateLabel}</span>
              <span class="count-badge">${dayBookings.length}</span>
            </div>
            <span>${dayName}</span>
            ${isAllCollected ? '<span class="collected-stamp">Collected</span>' : ''}
        </div>
        <div class="day-body">
          ${dayBookings.length === 0 ? '<div style="opacity:0.2; font-style:italic; margin-top:10px;">No bookings</div>' : 
            dayBookings.map(b => {
              const collected = b.statuses && b.statuses.every(st => st.toLowerCase().includes("collected"));
              return `
              <div class="day-booking-item" style="${collected ? 'opacity:0.4;' : ''}">
                <div style="font-weight:700; color:#f1c232;">${formatTime(b.startdatetime)}</div>
                <div style="font-weight:600;">${b.username}</div>
                <div style="font-size:11px; opacity:0.8;">${b.status}</div>
              </div>`;
            }).join('')}
        </div>
      </div>`;
  });
  html += `</div>`;
  tableWrap.innerHTML = html;
  syncRotatedLayout();
}

async function fetchBookings(){
  let url = `/api/bookings-tech?day=${dayMode}`;
  if (dayMode === "overview") url += `&start=${weekPicker.value}`;

  try {
    const r = await fetch(url);
    const data = await r.json();
    let list = data.bookings || [];
    
    if (dayMode === "overview") {
      renderOverview(list);
    } else {
      list = list.filter(b => !(b.statuses && b.statuses.every(st => st.includes("collected"))));
      list.sort((a,b)=> new Date(a.startdatetime) - new Date(b.startdatetime));
      
      let html = `<table><thead><tr><th>Time</th><th>Name</th><th>Status</th><th>Equipment</th><th>Actions</th></tr></thead><tbody>`;
      if (!list.length) html += `<tr><td colspan="5">No bookings.</td></tr>`;
      else {
        for (const b of list){
          const statusClass = b.status.toLowerCase().replace(/\s/g, '');
          
          let actionLabel = "";
          let actionClass = "";
          let nextState = "";

          if (b.status === "Not Picked") {
            actionLabel = "Preparing";
            actionClass = "btn-step-preparing";
            nextState = "preparing";
          } else if (b.status === "Preparing") {
            actionLabel = "Ready for Collection";
            actionClass = "btn-step-ready";
            nextState = "ready";
          } else {
            actionLabel = "Clear";
            actionClass = "btn-step-clear";
            nextState = "clear";
          }

          html += `<tr>
            <td>${formatTime(b.startdatetime)}</td>
            <td>${b.username}</td>
            <td>
              <span class="status ${statusClass}">${b.status}</span>
              <div class="readyin-wrap">
                <span class="readyin-chip">Ready in <b>${b.readyInMinutes}</b> min</span>
                <button class="readyin-btn" onclick="setReadyIn('${b._groupKey}', Math.max(0,${b.readyInMinutes}-5))">–5</button>
                <button class="readyin-btn" onclick="setReadyIn('${b._groupKey}', ${b.readyInMinutes}+5)">+5</button>
              </div>
            </td>
            <td>${renderAssets(b.assets)}</td>
            <td>
              <button class="btn-action-step ${actionClass}" onclick="updateStatus('${b._groupKey}','${nextState}')">
                ${actionLabel}
              </button>
            </td></tr>`;
        }
      }
      html += "</tbody></table>"; 
      tableWrap.innerHTML = html; 
      syncRotatedLayout();
    }
  } catch (err) { console.error("Fetch failed", err); }
}

async function updateStatus(key, status) {
  await fetch("/api/update-status", { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({key, status}) });
  fetchBookings();
}

async function setReadyIn(key, minutes) {
  await fetch("/api/ready-in", { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({key, minutes}) });
  fetchBookings();
}

/* --- Teachers & Departments Dashboard Logic --- */
const departmentMap = {
  "Technical": ["Julian MacDonnell","Asya Ali-Mehmet","Elif Sengul","Joe Reardon","Max Jung","Thomas Mallen","Stefan Aitange"],
  "Post Production": ["Adam Thomas","Oliver Turner","Lynda Boudjeltia","Scott Bromley","Paul Cousins"],
  "Production Management": ["Poppy Coggins","Chris Leach","Emlyn Pool","Claire Wiener","Kiz Hoque"],
  "Development": ["Lucy Jordan","Soumaya Elliott","John Wagland","Will Howie","Finn Conduct","Jack Avery"],
  "Level 4": ["Iris Helfer","Michael Jobling","Anthony Thomas","Begum Whitehead","Lena Nix"]
};

const allowedTeachers = Object.values(departmentMap).flat();
const CATEGORY_ORDER = {video:1, lighting:2, sound:3, grip:4, uncategorised:5};

function processAssets(list){
  const map={};
  list.forEach(a=>{
    if(!map[a.name]) map[a.name]={...a,count:0};
    map[a.name].count++;
  });
  return Object.values(map).sort((a,b)=>{
    const A=CATEGORY_ORDER[a.category]||999;
    const B=CATEGORY_ORDER[b.category]||999;
    return A===B ? a.name.localeCompare(b.name) : A-B;
  });
}

function assetPill(a){
  const qty=a.count>1?` ×${a.count}`:"";
  const cat=(a.category||"uncategorised").toLowerCase();
  return `<span class="asset-pill asset-${cat}">${a.name}${qty}</span>`;
}

let allTeacherHTML="";
let deptOpenState={};

const CAMERA_LIST = ["Sony FX9","Sony FX30","Sony A7IV","Sony A7Sii","Sony A7IV + Cage","Sony ZV-E10 II","Sony A6000"];
const SOUND_LIST = ["Zoom F6","Zoom H5","Sony Radio Mic Kit","Sony Radio Boom Mic Receiver + Transmiter"];
const GRIP_LIST = ["Sachtler Tripods","SmallRig shoulder Rig","SmallRig Tripod","Libec Tripod","DJI RS 4","DJI RS4 PRO COMBO","DJI RS 3","DJI Ronin S","Easyrig"];

async function loadTeachersDashboard() {
  tableWrap.innerHTML = `
    <div class="teacher-dashboard-root">
      <div class="tabs">
        <div class="tab active" data-target="teachersTab" onclick="switchTeacherTab('teachersTab')">Teachers</div>
        <div class="tab" data-target="departmentsTab" onclick="switchTeacherTab('departmentsTab')">Departments</div>
      </div>
      <main style="padding:16px 0;">
        <div id="teachersTab" class="section active">
          <input id="teacherSearch" placeholder="Search…" oninput="filterTeachers()">
          <h2 style="font-size:18px;margin-top:20px;color:#0f172a;">Teachers</h2>
          <div id="teacherTable"></div>
        </div>
        <div id="departmentsTab" class="section">
          <h2 style="font-size:18px;color:#0f172a;">Departments</h2>
          <div id="departmentWrap"></div>
        </div>
      </main>
    </div>
  `;

  try {
    const resp = await fetch('/api/bookings-all');
    const data = await resp.json();
    const bookings = data.bookings || [];

    const relevant = bookings.filter(b=>allowedTeachers.includes(b.username));
    const byTeacher={};
    allowedTeachers.forEach(t=>byTeacher[t]=[]);
    relevant.forEach(b=>b.assets.forEach(a=>byTeacher[b.username].push(a)));

    let html="";
    Object.keys(departmentMap).forEach(dept=>{
      const teachers=departmentMap[dept].slice().sort((a,b)=>a.localeCompare(b));
      const deptItems=[];
      teachers.forEach(t=>deptItems.push(...byTeacher[t]));

      const open = deptOpenState[dept] ?? false;

      html+=`
        <div class="dept-block">
          <div class="dept-header" onclick="toggleDept('${dept}')">
            <span class="chevron">${open ? "▾" : "▸"}</span> ${dept}
          </div>
          <div class="dept-summary">${teachers.length} teachers — ${deptItems.length} items</div>
          <div class="dept-content" id="dept-${dept}" style="display:${open?"block":"none"};">
            <table>
              <thead><tr><th>Teacher</th><th>Equipment</th></tr></thead>
              <tbody>
      `;

      teachers.forEach(name=>{
        const assets=processAssets(byTeacher[name]);
        const pillHTML=assets.length ? assets.map(assetPill).join("") : "<i>No equipment</i>";
        html+=`
          <tr data-teacher="${name.toLowerCase()}">
            <td class="teacher-name">${name}</td>
            <td>${pillHTML}</td>
          </tr>
        `;
      });

      html+=`
              </tbody>
            </table>
          </div>
        </div>
      `;
    });

    allTeacherHTML=html;
    const tTable = document.getElementById("teacherTable");
    if (tTable) tTable.innerHTML = html;

    const dWrap = document.getElementById("departmentWrap");
    if (dWrap) dWrap.innerHTML = buildDepartments(byTeacher);
    syncRotatedLayout();
  } catch (err) { console.error("Teachers dashboard load failed", err); }
}

function switchTeacherTab(targetId) {
  document.querySelectorAll('.teacher-dashboard-root .tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.teacher-dashboard-root .section').forEach(s=>s.classList.remove('active'));
  const clickedTab = document.querySelector(`.teacher-dashboard-root .tab[data-target="${targetId}"]`);
  if (clickedTab) clickedTab.classList.add('active');
  const targetSec = document.getElementById(targetId);
  if (targetSec) targetSec.classList.add('active');
  syncRotatedLayout();
}

function buildDepartments(byTeacher){
  let html="";
  Object.keys(departmentMap).forEach(dept=>{
    const allItems=[];
    departmentMap[dept].forEach(t=>allItems.push(...byTeacher[t]));
    const processed = processAssets(allItems);

    const cams = processed.filter(a => CAMERA_LIST.includes(a.name));
    const snd  = processed.filter(a => SOUND_LIST.includes(a.name));
    const grip = processed.filter(a => GRIP_LIST.includes(a.name));
    const light = processed.filter(a => a.category==="lighting");

    const show = deptOpenState[`show_${dept}`] ?? false;

    html += `
      <div class="dept-block">
        <div class="dept-header">${dept}</div>
        <div class="cat-stack">
          <div>${cams.map(assetPill).join("")}</div>
          <div>${snd.map(assetPill).join("")}</div>
          <div>${light.map(assetPill).join("")}</div>
          <div>${grip.map(assetPill).join("")}</div>
          <button class="show-all-btn" onclick="toggleShowAll('${dept}')">
            ${show ? "Hide" : "Show All"}
          </button>
        </div>
        <div id="dept-all-${dept}" style="display:${show?'block':'none'};margin-top:10px;">
          ${processed.map(assetPill).join("")}
        </div>
      </div>
    `;
  });
  return html;
}

function toggleDept(dept){
  deptOpenState[dept] = !deptOpenState[dept];
  loadTeachersDashboard();
}

function toggleShowAll(dept){
  deptOpenState[`show_${dept}`] = !deptOpenState[`show_${dept}`];
  loadTeachersDashboard();
}

function filterTeachers(){
  const searchInput = document.getElementById("teacherSearch");
  if (!searchInput) return;
  const q = searchInput.value.trim().toLowerCase();
  const container = document.getElementById("teacherTable");
  if(!container) return;

  if(q===""){
    container.innerHTML = allTeacherHTML;
    return;
  }

  const temp = document.createElement("div");
  temp.innerHTML = allTeacherHTML;

  temp.querySelectorAll(".dept-block").forEach(block=>{
    const rows = block.querySelectorAll("tbody tr");
    let matches = 0;

    rows.forEach(row=>{
      if(row.dataset.teacher && row.dataset.teacher.includes(q)){
        row.style.display = "";
        matches++;
      } else {
        row.style.display = "none";
      }
    });

    const content = block.querySelector(".dept-content");
    const chevron = block.querySelector(".chevron");

    if(matches === 0){
      block.style.display = "none";
    } else {
      block.style.display = "";
      if(content) content.style.display = "block";
      if(chevron) chevron.textContent = "▾";
    }
  });
  container.innerHTML = temp.innerHTML;
}

getScrollWrap().addEventListener("wheel", (e) => {
  if (drawingEnabled) return;
  const delta = Math.abs(e.deltaY) >= Math.abs(e.deltaX) ? e.deltaY : e.deltaX;
  if (delta) { e.preventDefault(); getScrollWrap().scrollLeft += delta; }
}, { passive:false });

window.addEventListener("resize", syncRotatedLayout);
initYearPicker();
setInterval(() => {
    if (dayMode !== "utilisation" && dayMode !== "teachers") fetchBookings();
}, 10000);
fetchBookings();
</script>
</body>
</html>
